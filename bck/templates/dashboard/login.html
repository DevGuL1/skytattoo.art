{% extends "base.html" %}
{% load static %}
{% block body %}
<section class="banner-header full-height valign bg-img bg-fixed" data-overlay-dark="6" data-background="{% static 'img/slider/2.jpg' %}">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="dashboard-card">
                    <h2 class="mb-4 text-white">Dashboard Login</h2>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
